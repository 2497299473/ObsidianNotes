apiVersion: v1
kind: Secret
metadata:
  name: {{ include "go-todo-api.fullname" . }}-secret
  labels:
    {{- include "go-todo-api.labels" . | nindent 4 }}
type: Opaque
# stringData: 明文写入（Helm 渲染时自动处理）
# 生产环境应通过 ExternalSecrets Operator 或 Vault 注入，不硬编码在 values.yaml 中
stringData:
  # Bitnami 子 chart 的 Service 命名为 <release>-postgresql / <release>-redis-master，
  # 因此这里必须用 .Release.Name，而非 fullname（release 名≠chart 名时 fullname 会带 chart 名前缀）
  DB_DSN: {{ printf "host=%s-postgresql user=%s password=%s dbname=%s port=5432 sslmode=disable" .Release.Name .Values.postgresql.auth.username .Values.postgresql.auth.password .Values.postgresql.auth.database | quote }}
  REDIS_URL: {{ printf "redis://%s-redis-master:6379" .Release.Name | quote }}
