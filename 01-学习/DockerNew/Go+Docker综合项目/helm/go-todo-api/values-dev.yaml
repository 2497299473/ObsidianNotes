# 开发环境覆盖配置
# 安装: helm install go-todo-api ./helm/go-todo-api -f values-dev.yaml
# 特点: 单副本、debug 模式、无持久化、无监控

replicaCount: 1

image:
  pullPolicy: Always
  tag: "latest"

autoscaling:
  enabled: false

env:
  GIN_MODE: debug
  PORT: "8080"
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
  OTEL_SERVICE_NAME: go-todo-api

resources:
  limits:
    cpu: 250m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 64Mi

postgresql:
  primary:
    persistence:
      enabled: false

redis:
  master:
    persistence:
      enabled: false
