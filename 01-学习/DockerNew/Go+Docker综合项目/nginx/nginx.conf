# Nginx 反向代理配置（conf.d 风格）
# 对应 DockerNew 第 10 章：反向代理 + 静态站点托管 + ELK 日志收集
# 挂载方式: ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
# 架构: 浏览器 → Nginx(:80) → Go API(:8080)
# 功能: 端口收敛 + 限流 + 安全头 + Gzip + 超时控制 + JSON 访问日志（供 ELK 解析）

# 上游：Go API（容器名即 DNS 名，Docker Compose 自动解析）
upstream go_api {
    server api:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# 限流区域（每 IP 10 req/s，突发 20 个）
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# JSON 访问日志格式（供 ELK 收集和分析）
log_format json_combined escape=json '{"timestamp":"$time_iso8601",'
    '"nginx":true,'
    '"remote_addr":"$remote_addr",'
    '"request":"$request",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time",'
    '"http_user_agent":"$http_user_agent",'
    '"http_referer":"$http_referer"}';

server {
    listen 80;
    server_name _;

    # ===== 安全头 =====
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ===== Gzip 压缩 =====
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1024;

    # ===== JSON 访问日志（供 ELK 收集）=====
    access_log /dev/stdout json_combined;

    # ===== Nginx 自身健康检查（不转发到后端）=====
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ===== Prometheus 指标端点（不限流，供 Prometheus 抓取）=====
    location = /metrics {
        proxy_pass http://go_api/metrics;
        proxy_set_header Host $host;
        access_log off;
    }

    # ===== 健康检查端点 =====
    location /health {
        proxy_pass http://go_api/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # ===== API 路由（含限流 + 超时）=====
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://go_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时控制
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # ===== 默认路由 → API 信息页 =====
    location = / {
        return 200 '{"service":"go-todo-api","status":"running","docs":"/api/todos","health":"/health","metrics":"/metrics","tracing":"jaeger:16686"}\n';
        add_header Content-Type application/json;
    }

    # ===== 其他路径 → 404 =====
    location / {
        return 404;
    }
}
