# 生产环境覆盖配置
# 对应 DockerNew 第 9 章：生产安全加固
# 用法: docker compose -f compose.yaml -f compose.prod.yaml up -d

services:
  api:
    # 生产从镜像仓库拉取（CI 构建并推送）
    image: ghcr.io/summer/go-todo-api:${APP_VERSION:-latest}
    restart: always
    environment:
      - GIN_MODE=release
    # 安全加固（对应 DockerNew 09 章）
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    user: "1000:1000"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      start_period: 20s

  db:
    ports: []               # 生产不暴露数据库端口
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cache:
    ports: []               # 生产不暴露 Redis 端口
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ===== Nginx 反向代理（生产入口）=====
  # 对应 DockerNew 第 10 章：反向代理 + 端口收敛
  nginx:
    image: nginx:1.27-alpine
    container_name: go-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
