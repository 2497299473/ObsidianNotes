# 监控叠加配置（含 Exporter + cAdvisor）
# 对应 DockerNew 第 10 章：容器监控 + 数据库/缓存指标采集
# 用法: docker compose -f compose.yaml -f compose.monitoring.yaml up -d
# 叠加在 compose.yaml 之上，不修改原有 api/db/cache 服务
# 访问:
#   Nginx              http://localhost:80
#   Prometheus         http://localhost:9090
#   Grafana            http://localhost:3000  (admin/admin)
#   postgres-exporter  内部端口 9187（Prometheus 抓取）
#   redis-exporter     内部端口 9121（Prometheus 抓取）
#   cAdvisor           http://localhost:8081  (容器资源面板)

services:
  # ===== Nginx 反向代理 =====
  nginx:
    image: nginx:1.27-alpine
    container_name: go-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ===== Prometheus 指标采集 =====
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: go-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    networks:
      - backend
    depends_on:
      - postgres-exporter
      - redis-exporter
      - cadvisor
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ===== Grafana 可视化面板 =====
  grafana:
    image: grafana/grafana:10.4.0
    container_name: go-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - backend
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ===== PostgreSQL Exporter — PG 内部指标 =====
  # 监控: 连接数、事务速率、缓存命中率、表大小、死锁
  # 对应 DockerNew 第 10 章：数据库监控
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: go-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://app:devpass@db:5432/appdb?sslmode=disable"
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ===== Redis Exporter — Redis 内部指标 =====
  # 监控: 内存使用、键数、命中率、命令速率、持久化状态
  # 对应 DockerNew 第 10 章：缓存监控
  redis-exporter:
    image: oliver006/redis_exporter:v1.59.0
    container_name: go-redis-exporter
    environment:
      REDIS_ADDR: "redis://cache:6379"
    networks:
      - backend
    depends_on:
      cache:
        condition: service_healthy
    restart: unless-stopped

  # ===== cAdvisor — Docker 容器指标 =====
  # 监控: 每个容器的 CPU、内存、网络 IO、文件系统使用
  # 对应 DockerNew 第 10 章：容器资源监控
  # 注意: Windows/macOS Docker Desktop 下 cAdvisor 可能无法获取完整指标
  # 生产环境建议使用 Linux 宿主机
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: go-cadvisor
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    networks:
      - backend
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
