# Logstash 日志处理管道
# 对应 DockerNew 第 10 章：ELK 日志收集
# 架构: Filebeat(:5044) → Logstash(解析+过滤) → Elasticsearch(:9200)
# 功能: JSON 解析、容器名匹配、时间戳标准化、Go/Nginx 日志格式适配

input {
  beats {
    port => 5044
  }
}

filter {
  # 1. 尝试解析 JSON 格式日志（Go API 和 Nginx JSON 日志）
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
      target => "parsed"
      skip_on_invalid_json => true
    }
  }

  # 2. 根据容器名添加 service 标签（Kibana 按服务筛选）
  if [container][name] =~ "go-api" {
    mutate { add_field => { "service" => "go-api" } }
  }
  else if [container][name] =~ "go-nginx" {
    mutate { add_field => { "service" => "nginx" } }
  }
  else if [container][name] =~ "go-db" {
    mutate { add_field => { "service" => "postgresql" } }
  }
  else if [container][name] =~ "go-cache" {
    mutate { add_field => { "service" => "redis" } }
  }
  else if [container][name] =~ "go-jaeger" {
    mutate { add_field => { "service" => "jaeger" } }
  }
  else if [container][name] =~ "go-prometheus" {
    mutate { add_field => { "service" => "prometheus" } }
  }
  else if [container][name] =~ "go-grafana" {
    mutate { add_field => { "service" => "grafana" } }
  }

  # 3. 解析 Go log 默认格式（2026/07/28 15:00:00 /main.go:50: 消息）
  if [message] =~ /^\d{4}\/\d{2}\/\d{2}/ {
    grok {
      match => {
        "message" => "%{DATESTAMP:log_timestamp} %{GREEDYDATA:log_message}"
      }
      overwrite => ["message"]
    }
  }

  # 4. 提取日志级别（ERROR/WARN/INFO/DEBUG）
  if [message] =~ /(?i)\b(ERROR|WARN|WARNING|INFO|DEBUG|FATAL)\b/ {
    grok {
      match => { "message" => "(?i)%{LOGLEVEL:log_level}" }
    }
  }

  # 5. 标准化时间戳
  if [parsed][timestamp] {
    date {
      match => ["[parsed][timestamp]", "ISO8601"]
      target => "@timestamp"
    }
  }
  else if [log_timestamp] {
    date {
      match => ["log_timestamp", "yyyy/MM/dd HH:mm:ss"]
      target => "@timestamp"
    }
  }

  # 6. 清理冗余字段
  mutate {
    remove_field => ["agent.ephemeral_id", "agent.id", "agent.type", "agent.version",
                     "ecs.version", "log.offset", "input.type"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "go-todo-api-logs-%{+YYYY.MM.dd}"
  }
}
