# 对应 DockerNew 第 7 章：Docker Compose 多容器编排
# 基础配置（开发和生产共享的部分）

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go-api
    environment:
      - DB_DSN=host=db user=app password=devpass dbname=appdb port=5432 sslmode=disable
      - REDIS_URL=redis://cache:6379
      - PORT=8080
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: go-db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: appdb
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  cache:
    image: redis:7-alpine
    container_name: go-cache
    command: redis-server --save 60 1 --loglevel verbose
    volumes:
      - cache-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  db-data:
  cache-data:

networks:
  backend:
    driver: bridge
