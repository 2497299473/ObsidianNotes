# Grafana 仪表盘自动加载
# 对应 DockerNew 第 10 章：监控可视化
# 容器启动时自动扫描 /var/lib/grafana/dashboards 目录下的 JSON 仪表盘文件

apiVersion: 1

providers:
  - name: "Go API"
    orgId: 1
    folder: "Go API"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
