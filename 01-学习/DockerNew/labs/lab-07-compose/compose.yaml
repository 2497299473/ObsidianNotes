# 对应 DockerNew 第 7 章：Docker Compose 多容器编排
# Web(Flask) + PostgreSQL + Redis 三服务，含健康检查和依赖管理
# 用法: docker compose up -d --build

services:
  web:
    build: .
    container_name: compose-web
    ports:
      - "${WEB_PORT:-5000}:5000"
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER:-app}
      - DB_PASSWORD=${DB_PASS:-devpass}
      - DB_NAME=${DB_NAME:-appdb}
      - REDIS_URL=redis://cache:6379
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: postgres:16-alpine
    container_name: compose-db
    environment:
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASS:-devpass}
      POSTGRES_DB: ${DB_NAME:-appdb}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  cache:
    image: redis:7-alpine
    container_name: compose-cache
    command: redis-server --save 60 1 --loglevel verbose
    volumes:
      - cache-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  db-data:
  cache-data:

networks:
  backend:
    driver: bridge
