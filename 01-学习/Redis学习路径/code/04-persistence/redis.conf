# Redis 阶段二 · 持久化配置
# 对应笔记: [[01-RDB与AOF持久化]]

# RDB 配置
save 900 1
save 300 10
save 60 10000

# AOF 配置
appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes

# 混合持久化（RDB header + AOF tail）
# 重启时先加载 RDB（快），再回放 AOF（补增量）

# 数据目录：run.sh 里的 mkdir -p data 只有配上这一行才生效
# （不配则 dump.rdb / appendonlydir 全部落在启动时的 cwd，多实例易互盖）
dir ./data
